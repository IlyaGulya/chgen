# CI supplies compilers and disposable servers, then invokes the same runner
# used locally. Test selection, seeds, gates and report semantics live in
# internal/tooling/cmd/verify, not in this workflow.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read

env:
  MINIMUM_GO_VERSION: "1.24.0"
  CURRENT_GO_VERSION: "1.26.5"
  GOTOOLCHAIN: local

jobs:
  minimum-go:
    name: minimum Go 1.24
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.MINIMUM_GO_VERSION }}
          check-latest: false
      - name: Verify minimum Go
        run: ./scripts/check.sh -suite minimum -report "${RUNNER_TEMP}/verification"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-minimum
          path: ${{ runner.temp }}/verification
          if-no-files-found: error

  generated-code-compatibility:
    name: generated code (Go ${{ matrix.go }}, driver ${{ matrix.driver }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - go: "1.24.0"
            driver: "v2.42.0"
          - go: "1.25.0"
            driver: "v2.47.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: false
      - name: Compile generated code
        run: ./scripts/check.sh -suite compatibility -go "${{ matrix.go }}" -driver "${{ matrix.driver }}" -report "${RUNNER_TEMP}/verification"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-compatibility-${{ matrix.go }}-${{ matrix.driver }}
          path: ${{ runner.temp }}/verification
          if-no-files-found: error

  build:
    name: build and default tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.CURRENT_GO_VERSION }}
          check-latest: false
      - name: Verify offline
        run: ./scripts/check.sh -suite offline -report "${RUNNER_TEMP}/verification"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-offline
          path: ${{ runner.temp }}/verification
          if-no-files-found: error

  public-pipeline-fuzz:
    name: public SQL pipeline fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.CURRENT_GO_VERSION }}
          check-latest: false
      - name: Restore discovered fuzz inputs
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build/fuzz
          key: sql-fuzz-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sql-fuzz-${{ runner.os }}-
      - name: Verify public pipeline
        env:
          VERIFY_PROFILE: ${{ github.event_name == 'schedule' && 'deep' || 'quick' }}
        run: ./scripts/check.sh -suite fuzz -profile "$VERIFY_PROFILE" -report "${RUNNER_TEMP}/verification"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-fuzz
          path: ${{ runner.temp }}/verification
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: public-sql-minimized-failures
          path: |
            testdata/fuzz/
            internal/functionrules/testdata/fuzz/
          if-no-files-found: warn

  type-oracle:
    name: pinned type and runtime checks
    runs-on: ubuntu-latest
    timeout-minutes: 360
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8.29.51
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.CURRENT_GO_VERSION }}
          check-latest: false
      - name: Verify types and generated execution
        env:
          VERIFY_PROFILE: ${{ github.event_name == 'schedule' && 'deep' || 'full' }}
        run: ./scripts/check.sh -suite types -profile "$VERIFY_PROFILE" -http http://localhost:8123 -native localhost:9000 -report "${RUNNER_TEMP}/verification"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-types
          path: ${{ runner.temp }}/verification
          if-no-files-found: error

  exec-oracle:
    name: execution oracle
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8.29.51
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.CURRENT_GO_VERSION }}
          check-latest: false
      - name: Verify execution oracle
        env:
          VERIFY_PROFILE: ${{ github.event_name == 'schedule' && 'deep' || 'full' }}
        run: ./scripts/check.sh -suite execution -profile "$VERIFY_PROFILE" -http http://localhost:8123 -native localhost:9000 -report "${RUNNER_TEMP}/verification"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-execution
          path: ${{ runner.temp }}/verification
          if-no-files-found: error

  type-boundary-probe:
    name: deterministic type boundary
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8.29.51
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.CURRENT_GO_VERSION }}
          check-latest: false
      - name: Verify deterministic boundary
        run: ./scripts/check.sh -suite boundary -http http://localhost:8123 -report "${RUNNER_TEMP}/verification"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-boundary
          path: ${{ runner.temp }}/verification
          if-no-files-found: error

  version-matrix:
    name: version boundary
    runs-on: ubuntu-latest
    services:
      clickhouse-pinned:
        image: clickhouse/clickhouse-server:25.8.29.51
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 30
      clickhouse-candidate:
        image: clickhouse/clickhouse-server:24.8.14.39
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        ports:
          - 18123:8123
          - 19000:9000
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.CURRENT_GO_VERSION }}
          check-latest: false
      - name: Verify measured cross-version boundary
        run: ./scripts/check.sh -suite versions -http http://localhost:8123 -candidate-http http://localhost:18123 -report "${RUNNER_TEMP}/verification"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-versions
          path: ${{ runner.temp }}/verification
          if-no-files-found: error

  verification-summary:
    name: complete verification summary
    if: always()
    needs: [minimum-go, generated-code-compatibility, build, public-pipeline-fuzz, type-oracle, exec-oracle, type-boundary-probe, version-matrix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.CURRENT_GO_VERSION }}
          check-latest: false
      - uses: actions/download-artifact@v8
        with:
          pattern: verification-*
          path: ${{ runner.temp }}/verification-inputs
      - name: Combine reports and require every CI cell
        run: ./scripts/check.sh -merge "${RUNNER_TEMP}/verification-inputs" -expect ci -report "${RUNNER_TEMP}/verification-summary"
      - uses: actions/upload-artifact@v7
        id: combined-report
        if: always()
        with:
          name: complete-verification-summary
          path: ${{ runner.temp }}/verification-summary
          if-no-files-found: error
      - name: Publish readable summary
        if: always()
        env:
          REPORT_URL: ${{ steps.combined-report.outputs.artifact-url }}
        run: |
          if [ -f "${RUNNER_TEMP}/verification-summary/summary.md" ]; then
            # Relative file links work inside the downloaded bundle, not on
            # the Actions summary page. Keep their labels here instead.
            sed -E 's/\[([^]]+)\]\([^)]*\)/\1/g' "${RUNNER_TEMP}/verification-summary/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$REPORT_URL" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "[Download the complete report]($REPORT_URL)" >> "$GITHUB_STEP_SUMMARY"
          fi
